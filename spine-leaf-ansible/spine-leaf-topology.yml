name: spine-leaf

topology:
  nodes:
    spine1:
      kind: arista_ceos
      image: ceos:4.36.1F
      startup-config: configs/spine1-config

    spine2:
      kind: arista_ceos
      image: ceos:4.36.1F
      startup-config: configs/spine2-config

    leaf1:
      kind: arista_ceos
      image: ceos:4.36.1F
      startup-config: configs/leaf1-config

    leaf2:
      kind: arista_ceos
      image: ceos:4.36.1F
      startup-config: configs/leaf2-config

    leaf3:
      kind: arista_ceos
      image: ceos:4.36.1F
      startup-config: configs/leaf3-config

    leaf4:
      kind: arista_ceos
      image: ceos:4.36.1F
      startup-config: configs/leaf4-config

    server1-1:
      kind: linux
      image: alpine:latest
      exec:
      - ip link set eth1 up
      - ip addr add 192.168.10.2/29 dev eth1
      - ip route replace default via 192.168.10.1 dev eth1

    server1-2:
      kind: linux
      image: alpine:latest
      exec:
      - ip link set eth1 up
      - ip addr add 192.168.10.3/29 dev eth1
      - ip route replace default via 192.168.10.1 dev eth1

    server2-1:
      kind: linux
      image: alpine:latest
      exec:
      - ip link set eth1 up
      - ip addr add 192.168.10.10/29 dev eth1
      - ip route replace default via 192.168.10.9 dev eth1

    server2-2:
      kind: linux
      image: alpine:latest
      exec:
      - ip link set eth1 up
      - ip addr add 192.168.10.11/29 dev eth1
      - ip route replace default via 192.168.10.9 dev eth1

    server3-1:
      kind: linux
      image: alpine:latest
      exec:
      - ip link set eth1 up
      - ip addr add 192.168.10.18/29 dev eth1
      - ip route replace default via 192.168.10.17 dev eth1

    server3-2:
      kind: linux
      image: alpine:latest
      exec:
      - ip link set eth1 up
      - ip addr add 192.168.10.19/29 dev eth1
      - ip route replace default via 192.168.10.17 dev eth1

    server4-1:
      kind: linux
      image: alpine:latest
      exec:
      - ip link set eth1 up
      - ip addr add 192.168.10.26/29 dev eth1
      - ip route replace default via 192.168.10.25 dev eth1

    server4-2:
      kind: linux
      image: alpine:latest
      exec:
      - ip link set eth1 up
      - ip addr add 192.168.10.27/29 dev eth1
      - ip route replace default via 192.168.10.25 dev eth1

  links:
  - endpoints: [ "spine1:eth3", "leaf1:eth1" ]
  - endpoints: [ "spine1:eth4", "leaf2:eth1" ]
  - endpoints: [ "spine1:eth5", "leaf3:eth1" ]
  - endpoints: [ "spine1:eth6", "leaf4:eth1" ]
  - endpoints: [ "spine2:eth3", "leaf1:eth2" ]
  - endpoints: [ "spine2:eth4", "leaf2:eth2" ]
  - endpoints: [ "spine2:eth5", "leaf3:eth2" ]
  - endpoints: [ "spine2:eth6", "leaf4:eth2" ]
  - endpoints: [ "leaf1:eth23", "server1-1:eth1" ]
  - endpoints: [ "leaf1:eth24", "server1-2:eth1" ]
  - endpoints: [ "leaf2:eth23", "server2-1:eth1" ]
  - endpoints: [ "leaf2:eth24", "server2-2:eth1" ]
  - endpoints: [ "leaf3:eth23", "server3-1:eth1" ]
  - endpoints: [ "leaf3:eth24", "server3-2:eth1" ]
  - endpoints: [ "leaf4:eth23", "server4-1:eth1" ]
  - endpoints: [ "leaf4:eth24", "server4-2:eth1" ]
